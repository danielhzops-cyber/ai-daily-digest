name: Daily digest

on:
  schedule:
    # 12:00 UTC = 6:00 am in Costa Rica (UTC-6, no daylight saving).
    # GitHub may start scheduled jobs a few minutes late.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: digest   # shared with the weekly job so they never run at the same time
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build today's digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m digest.daily

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs logs
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Daily digest $(TZ=America/Costa_Rica date +%F)"
            git pull --rebase
            git push
          fi
