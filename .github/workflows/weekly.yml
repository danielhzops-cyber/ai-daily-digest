name: Weekly digest

on:
  schedule:
    # Mondays 14:00 UTC = 8:00 am Costa Rica, two hours after the daily job,
    # so Monday's daily issue is included even if GitHub starts it late.
    - cron: "0 14 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build this week's digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m digest.weekly

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs logs
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Weekly digest $(TZ=America/Costa_Rica date +%F)"
            git pull --rebase
            git push
          fi
